[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robotic-manipulation-her"
version = "0.1.0"
description = "Goal-Conditioned Robotic Manipulation using SAC + Hindsight Experience Replay (HER) in PyBullet"
readme = "README.md"
authors = [
    { name = "Robotic Manipulation Research Team" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pybullet>=3.2.5",
    "gymnasium>=1.0.0",
    "stable-baselines3>=2.4.0",
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0.1",
    "tensorboard>=2.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
