# Phase 15.2.5B Configuration: Single-Object Grasp Acquisition (SAC + HER)
# Fresh model and fresh HerReplayBuffer on PandaSinglePreGraspEnv.

env:
  name: "SinglePreGrasp"
  distance_threshold: 0.05
  max_episode_steps: 80
  action_scale: 0.05

rl:
  algo: "SAC"
  policy: "MultiInputPolicy"
  seed: 42
  total_timesteps: 20000          # Initial budget; conditional extension to 50,000 total
  buffer_size: 200000
  batch_size: 128
  learning_rate: 0.0003
  learning_starts: 500            # >= 6 complete 80-step episodes before HER updates
  gamma: 0.98
  tau: 0.005
  use_her: true
  her_strategy: "future"
  her_n_sampled_goal: 4
  her_copy_info_dict: true
  device: "cpu"

eval:
  eval_freq: 5000
  n_eval_episodes: 10
  deterministic: true

checkpointing:
  save_freq: 5000
  naming_pattern: "checkpoint_{timesteps}_steps.zip"

paths:
  model_save_path: "experiments/multi_sort_phase15_5B/seed42/models"
  tensorboard_log: "logs/multi_sort_phase15_5B/seed42"

