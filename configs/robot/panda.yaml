# Franka Emika Panda Robot Configuration
robot:
  name: "franka_panda"
  urdf_path: "franka_panda/panda.urdf"
  base_position: [0.0, 0.0, 0.0]
  base_orientation: [0.0, 0.0, 0.0, 1.0] # [x, y, z, w]
  use_fixed_base: true

  # Kinematic indices for franka_panda/panda.urdf
  arm_joint_indices: [0, 1, 2, 3, 4, 5, 6]
  finger_joint_indices: [9, 10]
  ee_link_index: 11 # panda_grasptarget (centered between fingertip pads)
  hand_link_index: 8 # panda_hand

  # Joint limits for IK null-space projection and safety clamping
  joint_lower_limits: [-2.8973, -1.7628, -2.8973, -3.0718, -2.8973, -0.0175, -2.8973]
  joint_upper_limits: [2.8973, 1.7628, 2.8973, -0.0698, 2.8973, 3.7525, 2.8973]
  joint_ranges: [5.7946, 3.5256, 5.7946, 3.002, 5.7946, 3.77, 5.7946]
  
  # Standard neutral/home configuration (arm facing forward, elbow bent)
  neutral_joint_positions: [0.0, -0.785, 0.0, -2.356, 0.0, 1.571, 0.785]
  
  # Default end-effector orientation: facing directly downwards towards the table
  # Quaternion [x, y, z, w] for 180-deg roll (pointing Z-tool downwards)
  default_ee_orientation: [1.0, 0.0, 0.0, 0.0]

  # Cartesian end-effector control parameters
  cartesian_control:
    max_displacement: 0.05 # max delta position per control step in meters
    workspace_bounds:
      x: [0.25, 0.75]
      y: [-0.35, 0.35]
      z: [0.02, 0.50]
    
  # Inverse Kinematics solver parameters
  ik:
    max_iterations: 100
    residual_threshold: 0.0001
    damping: 0.05

  # Gripper parameters
  gripper:
    finger_min_position: 0.0   # fully closed
    finger_max_position: 0.04  # fully open per finger (total opening: 0.08m)
    max_force: 25.0            # Newtons
    open_position: 0.04
    closed_position: 0.0
