# Phase 4 (15.3): Orientation-Aware Peg-in-Hole Assembly (SAC + HER + Balanced Assembly Demos)

env:
  name: "AssemblyDense"
  distance_threshold: 0.02
  orientation_threshold: 0.1
  max_episode_steps: 120
  action_scale: 0.05
  yaw_scale: 0.25

rl:
  algo: "SAC"
  policy: "MultiInputPolicy"
  seed: 42
  total_timesteps: 5000
  buffer_size: 100000
  batch_size: 128
  learning_rate: 0.0003
  learning_starts: 1000
  gamma: 0.98
  tau: 0.005
  use_her: true
  her_strategy: "future"
  her_n_sampled_goal: 2
  her_copy_info_dict: true
  device: "cpu"
  demo_warmstart_path: "experiments/assembly_phase15_3/seed42/demonstrations/assembly_demos.pkl"
  demo_warmstart_method: "her_buffer"
  use_bc_sac: true
  bc_pretrain_steps: 2000
  bc_pretrain_lr: 0.001
  actor_update_start_step: 2000
  bc_lambda_init: 0.305
  bc_lambda_final: 0.02
  bc_decay_steps: 5000
  bc_batch_size: 128
  bc_normalize_q: true
  ent_coef: "auto_0.03"
  min_ent_coef: 0.015

eval:
  eval_freq: 2500
  n_eval_episodes: 10
  deterministic: true

checkpointing:
  save_freq: 2500
  naming_pattern: "checkpoint_{timesteps}_steps.zip"

paths:
  model_save_path: "experiments/assembly_phase15_3/seed42/models"
  tensorboard_log: "logs/assembly_phase15_3/seed42"

