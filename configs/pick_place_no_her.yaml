env:
  name: "PickPlace"
  distance_threshold: 0.05
  max_episode_steps: 100
  action_scale: 0.05

rl:
  algo: "SAC"
  seed: 10
  total_timesteps: 10000
  buffer_size: 100000
  batch_size: 256
  learning_rate: 0.001
  gamma: 0.95
  tau: 0.05
  use_her: false

eval:
  eval_freq: 2500
  n_eval_episodes: 20

paths:
  model_save_path: "experiments/pick_place/E1_no_her/models"
  tensorboard_log: "experiments/pick_place/E1_no_her/logs"
