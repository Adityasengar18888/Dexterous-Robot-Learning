# Phase 7: Sorting Configuration

env:
  name: "Sort"
  distance_threshold: 0.05
  max_episode_steps: 150
  action_scale: 0.05

rl:
  seed: 10
  total_timesteps: 10000
  buffer_size: 1000000
  batch_size: 256
  learning_rate: 0.001
  learning_starts: 200
  gamma: 0.95
  tau: 0.05
  use_her: true
  her_strategy: "future"
  her_n_sampled_goal: 4

eval:
  eval_freq: 2500
  n_eval_episodes: 10

paths:
  model_save_path: "experiments/sort/models"
  tensorboard_log: "logs/sort"
