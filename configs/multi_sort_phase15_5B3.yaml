# Phase 1 Corrective Exp (5B3): Short BC Actor Warmstart + Decaying BC SAC + Entropy Floor

env:
  name: "SinglePreGrasp"
  distance_threshold: 0.05
  max_episode_steps: 80
  action_scale: 0.05
  reward_config:
    use_vertical_potential: true
    w_vertical_potential: 2.0
    grasp_z_offset: 0.0
    vert_stop_tol_m: 0.008

rl:
  algo: "SAC"
  policy: "MultiInputPolicy"
  seed: 42
  total_timesteps: 5000           # Fast 5k diagnostic first; extend if strong grasp+lift holds
  buffer_size: 100000
  batch_size: 128
  learning_rate: 0.0003
  learning_starts: 500
  gamma: 0.98
  tau: 0.005
  use_her: true
  her_strategy: "future"
  her_n_sampled_goal: 4
  her_copy_info_dict: true
  device: "cpu"
  demo_warmstart_path: "experiments/multi_sort_phase15_5B2/seed42/demonstrations/balanced_pregrasp_demos_50ep.pkl"
  demo_warmstart_method: "her_buffer"
  use_bc_sac: true
  bc_pretrain_steps: 1000
  bc_pretrain_lr: 0.001
  bc_lambda_init: 0.305
  bc_lambda_final: 0.02
  bc_decay_steps: 5000
  bc_batch_size: 128
  min_ent_coef: 0.02

eval:
  eval_freq: 2500
  n_eval_episodes: 10
  deterministic: true

checkpointing:
  save_freq: 2500
  naming_pattern: "checkpoint_{timesteps}_steps.zip"

paths:
  model_save_path: "experiments/multi_sort_phase15_5B3/seed42/models"
  tensorboard_log: "logs/multi_sort_phase15_5B3/seed42"

