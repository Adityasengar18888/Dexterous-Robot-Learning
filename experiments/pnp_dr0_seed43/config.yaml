env:
  action_scale: 0.05
  distance_threshold: 0.05
  max_episode_steps: 100
  name: PickPlace
  randomizer:
    enabled: false
eval:
  eval_freq: 2500
  n_eval_episodes: 10
paths:
  model_save_path: experiments/pnp_dr0_seed43/models
  tensorboard_log: experiments/pnp_dr0_seed43/logs
rl:
  batch_size: 256
  buffer_size: 1000000
  gamma: 0.95
  her_n_sampled_goal: 4
  her_strategy: future
